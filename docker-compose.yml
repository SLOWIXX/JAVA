services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projet
      POSTGRES_USER: projet
      POSTGRES_PASSWORD: projet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - app
    environment:
      VITE_BACKEND_URL: http://app:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:


